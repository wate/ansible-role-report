    ## レポート生成のテスト
    - name: Test report generation
      delegate_to: localhost
      become: false
      block:
        - name: Check report directory exists
          ansible.builtin.stat:
            path: "{{ report_dir }}/{{ inventory_hostname }}"
          register: report_dir_result
        - name: Assert report directory exists
          ansible.builtin.assert:
            that:
              - report_dir_result.stat.exists
              - report_dir_result.stat.isdir
            fail_msg: "Report directory does not exist"
            success_msg: "Report directory exists"
        - name: Check report files exist
          ansible.builtin.stat:
            path: "{{ report_dir }}/{{ inventory_hostname }}/{{ item }}"
          loop:
            - basic.md
            - package.md
            - port.md
            - disk.md
            - traffic.md
            - user_group.md
            - file.md
          register: report_files_result
        - name: Assert all report files exist
          ansible.builtin.assert:
            that:
              - item.stat.exists
              - item.stat.isreg
            fail_msg: "Report file {{ item.item }} does not exist"
            success_msg: "Report file {{ item.item }} exists"
          loop: "{{ report_files_result.results }}"
          loop_control:
            label: "{{ item.item }}"
        - name: Check vulnerability report is not generated
          ansible.builtin.stat:
            path: "{{ report_dir }}/{{ inventory_hostname }}/vulnerability.md"
          register: vulnerability_report_result
        - name: Assert vulnerability report is not generated
          ansible.builtin.assert:
            that:
              - not vulnerability_report_result.stat.exists
            fail_msg: "vulnerability.md is generated while report_vulnerability_enabled is false"
            success_msg: "vulnerability.md is not generated"
    ## SBOMの目視確認用の取得
    - name: Fetch generated SBOM
      ansible.builtin.fetch:
        src: "{{ report_sbom_dir }}/{{ report_sbom_filename }}"
        dest: "{{ report_dir }}/{{ inventory_hostname }}/{{ report_sbom_filename }}"
        flat: true
      when: sbom_result.stat.exists
