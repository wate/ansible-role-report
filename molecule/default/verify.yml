# code: language=ansible
---
- name: Verify
  hosts: all
  gather_facts: false
  become: true
  tasks:
    ## テストの前処理
    - name: Gather package facts
      ansible.builtin.package_facts:
    - name: Gather service facts
      ansible.builtin.service_facts:
    - name: Gather listen ports facts
      community.general.listen_ports_facts:
    - name: Gather user facts
      ansible.builtin.getent:
        database: passwd
    - name: Gather group facts
      ansible.builtin.getent:
        database: group
    - name: Set assert variables
      ansible.builtin.set_fact:
        registered_users: "{{ ansible_facts.getent_passwd }}"
        registered_groups: "{{ ansible_facts.getent_group }}"
        listen_tcp_posts: "{{ ansible_facts.tcp_listen | map(attribute='port') | unique | sort | list }}"
        listen_udp_posts: "{{ ansible_facts.udp_listen | map(attribute='port') | unique | sort | list }}"
    ## 依存パッケージのテスト
    - name: Test dependency packages
      block:
        - name: Assert jc package is installed
          ansible.builtin.assert:
            that:
              - ansible_facts.packages['jc'] is defined
            fail_msg: "jc package is not installed"
            success_msg: "jc package is installed"
        - name: Check trivy binary exists
          ansible.builtin.stat:
            path: /usr/bin/trivy
          register: trivy_result
        - name: Assert trivy is installed
          ansible.builtin.assert:
            that:
              - trivy_result.stat.exists
              - trivy_result.stat.executable
            fail_msg: "trivy is not installed or not executable"
            success_msg: "trivy is installed and executable"
    ## SBOMのテスト
    - name: Test SBOM generation
      block:
        - name: Check SBOM file exists
          ansible.builtin.stat:
            path: "{{ report_sbom_dir }}/{{ report_sbom_filename }}"
          register: sbom_result
        - name: Read SBOM file
          ansible.builtin.slurp:
            src: "{{ report_sbom_dir }}/{{ report_sbom_filename }}"
          register: sbom_content
          when: sbom_result.stat.exists
        - name: Assert SBOM is generated as CycloneDX
          ansible.builtin.assert:
            that:
              - sbom_result.stat.exists
              - sbom_result.stat.isreg
              - sbom_result.stat.size > 0
              - (sbom_content.content | b64decode | from_json).bomFormat == 'CycloneDX'
              - (sbom_content.content | b64decode | from_json).components | selectattr('purl', 'defined') | list | length > 0
            fail_msg: "SBOM is not generated correctly"
            success_msg: "SBOM is generated correctly"
